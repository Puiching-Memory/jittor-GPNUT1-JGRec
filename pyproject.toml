[project]
name = "jittor-gpnut1-jgrec"
version = "0.1.0"
description = "MVP code for Jittor GPNUT1 dynamic recommendation"
requires-python = "==3.12.*"
classifiers = [
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3.12",
]
dependencies = [
	"einops==0.8.2",
	"jittor==1.3.11.0",
	"jittor-geometric==2.0.0",
	"networkx==3.6.1",
	"nvidia-cudnn-cu12==8.9.7.29",
	"numpy==1.26.4",
	"pyparsing==3.3.2",
	"pymetis==2025.2.2",
	"lightgbm>=4.0",
	"scikit-learn==1.9.0",
	"scipy==1.17.1",
	"sympy==1.14.0",
	"rich==15.0.0",
	"tyro==1.0.13",
	"optuna==4.9.0",
]

[project.scripts]
jgrec-build = "jgrec.cli:main"
jgrec-tune-temporal-graph = "jgrec.tuning.temporal_graph:main"

[tool.uv.sources]
jittor = { path = "third_party/jittor", editable = true }
jittor-geometric = { path = "third_party/JittorGeometric", editable = true }

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
	"ast-grep-cli==0.42.3",
	"pytest==9.0.3",
	"pytest-cov==7.1.0",
	"ruff==0.15.16",
	"zensical==0.0.44",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [
	".cache",
	"data",
	"result",
	"site",
	"tests/fixtures",
	"third_party",
]

[tool.ruff.lint]
select = [
	"E",
	"W",
	"F",
	"I",
	"UP",
	"B",
	"C4",
	"SIM",
	"PIE",
	"RUF",
	"NPY",
	"PERF",
	"PLC0415",
]
# E501: 行宽交由 formatter 处理
# RUF001/002/003: 项目注释与文档为中文，全角标点属有意使用
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"sitecustomize.py" = ["SIM112"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
	"--strict-config",
	"--strict-markers",
	"--cov=jgrec",
	"--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["jgrec"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools]
package-dir = { "jgrec" = "src/jgrec" }
packages = [
	"jgrec",
	"jgrec.core",
	"jgrec.rankers",
	"jgrec.rankers.common",
	"jgrec.rankers.craft",
	"jgrec.rankers.temporal_graph",
	"jgrec.tuning",
]
py-modules = ["sitecustomize"]
